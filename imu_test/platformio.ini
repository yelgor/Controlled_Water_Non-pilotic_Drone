; ESP32-S3 WROOM + LSM9DS1 (I2C): перший тест IMU на столі
; Збірка й прошивка:  pio run -t upload
; Перегляд:           pio device monitor
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
; Serial іде через USB-UART міст (роз'єм "UART"/"COM" на платі).
; Якщо підключаєтесь до роз'єму "USB" (нативний), поставте ARDUINO_USB_CDC_ON_BOOT=1.
build_flags = -Wall -O2 -D ARDUINO_USB_CDC_ON_BOOT=1
upload_speed = 921600
monitor_speed = 921600
; не тримати плату в ресеті, коли монітор відкриває порт
monitor_rts = 0
monitor_dtr = 0
lib_deps = mikalhart/TinyGPSPlus@^1.0.3
